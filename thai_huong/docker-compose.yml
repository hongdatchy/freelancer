version: '3.8'

services:
  thai-huong-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thai-huong-schedule
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
